name: CI

# Un seul pipeline. Les trois checks gardent la porte ; taguer, écrire le
# CHANGELOG et pousser l'image sont des jobs en aval qui ne démarrent pas si
# l'un d'eux est rouge. Il n'y a plus de PR : `main` est la seule branche.
on:
  push:
    branches: [main]
  # Aucune PR dans le flux normal, mais Dependabot ou une contribution externe
  # en ouvrent. Le filet ne coûte rien tant qu'il n'y en a pas, et `release`
  # comme `deploy` sont neutralisés hors de `main`.
  pull_request:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Calculer la prochaine version sans taguer ni publier
        type: boolean
        default: false

# Sur une PR, un nouveau push annule le run précédent : inutile de payer pour un
# résultat périmé. Sur `main`, jamais : ce workflow tague, pousse un commit et
# déploie. Annulé entre deux de ces étapes, il laisse un tag sans release, ou une
# prod en avance sur le CHANGELOG, et aucun retry ne répare ça proprement.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Lint, types et tests unitaires : le retour rapide, celui qui doit rester
  # sous la minute.
  check:
    name: Lint · types · unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Les deux runtimes sont nécessaires et le sont explicitement : Bun installe
      # et lance les tests, Node build et sert Next.js (voir docs/adr/0001).
      # Ne pas se reposer sur le Node préinstallé du runner, dont la version bouge.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # setup-bun ne met en cache que le binaire téléchargé, pas les paquets.
      # Sans ça, `bun install` retélécharge tout le registre à chaque run.
      - name: Cache Bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          # Le lockfile détermine entièrement le jeu de paquets ; `runner.os` est
          # là parce que le cache contient des binaires extraits, spécifiques à
          # la plateforme. Le restore-keys évite un cold start à chaque bump :
          # on repart du dernier cache et `bun install` ne récupère que le delta.
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Lint (Biome)
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test



  # Le `needs` sur les deux checks est la garantie : aucun tag, aucun CHANGELOG,
  # aucune release ne sort d'un commit rouge. Il n'y a plus de PR pour l'attraper
  # avant — c'est ici que ça se joue.
  #
  # semantic-release pousse un commit `chore(release): … [skip ci]` sur `main`.
  # Il ne relance rien : GitHub ne déclenche aucun workflow pour un push fait
  # avec le GITHUB_TOKEN. Le `[skip ci]` est la seconde barrière, celle qui
  # servira le jour où un PAT remplacera ce token.
  release:
    name: Release
    needs: [check]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag, commit du CHANGELOG, création de la release
      issues: write # commentaire « livré en 1.2.3 » sur l'issue référencée
      pull-requests: write # idem sur une PR Dependabot déjà mergée
    outputs:
      released: ${{ steps.semantic.outputs.new_release_published }}
      tag: ${{ steps.semantic.outputs.new_release_git_tag }}
      version: ${{ steps.semantic.outputs.new_release_version }}
    steps:
      # fetch-depth: 0 est obligatoire : semantic-release lit tous les commits
      # depuis le dernier tag, et les tags eux-mêmes, pour décider du bump.
      # persist-credentials: false suit la recette officielle : semantic-release
      # construit sa propre URL de push authentifiée depuis GITHUB_TOKEN, et une
      # credential ambiante masquerait un PAT si on en installe un plus tard.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      # semantic-release est un outil Node ; il ne touche ni bun.lock ni les
      # node_modules du repo, donc pas de `bun install` ici.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Les plugins sont installés par l'action, pas déclarés en devDependencies :
      # rien à ajouter à package.json, donc bun.lock reste intact et
      # `bun install --frozen-lockfile` ne peut pas casser à cause de la release.
      - id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 24
          dry_run: ${{ inputs.dry_run == true }}
          extra_plugins: |
            @semantic-release/changelog@6
            @semantic-release/git@10
            conventional-changelog-conventionalcommits@8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # Déploie chaque push vert sur `main`, indépendamment du job `release` : une
  # correction en `chore:` ne produit pas de version mais doit partir en prod.
  # Le `needs` sur les checks est ce qui empêche un commit rouge d'atteindre la
  # prod : sans lui le job tournerait en parallèle d'eux.
  #
  # `dry_run` le neutralise, comme il neutralisait `publish` : un dispatch qui
  # ne sert qu'à prévisualiser la prochaine version n'a rien à mettre en ligne.
  deploy:
    name: Deploy
    needs: [check]
    if: github.ref == 'refs/heads/main' && inputs.dry_run != true
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    # Le pull/build/deploy se fait avec la CLI officielle, pas une action tierce.
    # `amondnet/vercel-action@v25` épinglait `vercel@25.1.0` — juin 2022, 34
    # majeures de retard — et échouait sur « Could not retrieve Project Settings » :
    # cette CLI-là ne sait plus lire les réglages d'un projet créé aujourd'hui.
    # La majeure est épinglée pour que le déploiement ne change pas tout seul ;
    # la bouger est un commit, pas une surprise un lundi matin.
    #
    # Le projet est lié par variables d'environnement plutôt que par un `.vercel`
    # commité : les deux identifiants sont des secrets GitHub (voir AGENTS.md,
    # « Security considerations ») et `.vercel` est gitignoré.
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Pas de `bun install` ici : le build tourne chez Vercel, pas sur le runner.
      # La CLI n'envoie que les sources — `node_modules` n'est jamais téléversé.
      # C'est le job `check` qui vérifie que le lockfile installe.
      - name: Deploy to Vercel
        run: npx --yes vercel@59 deploy --prod --yes --token="$VERCEL_TOKEN"
